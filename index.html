<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>藍 — N4 Kanji &amp; Vocabulary Trainer</title>
<style>
:root{
  --ink:#0F1729;          /* deep indigo ground */
  --ink-2:#1B2742;        /* raised indigo */
  --ink-3:#2A3856;        /* borders on dark */
  --washi:#EDE7DA;        /* paper */
  --washi-2:#DDD4C2;      /* paper shade */
  --sumi:#1A1A1A;         /* ink on paper */
  --moss:#3F7350;         /* correct */
  --moss-lt:#D6E4D8;
  --shu:#C4452F;          /* vermilion — wrong / urgent */
  --shu-lt:#F2D9D3;
  --brass:#B9932F;        /* accent, sparing */
  --mute:#8A93A6;
  --r:3px;
  --jp-serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
  --jp-sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--washi);
  font-family:var(--ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100vh}
header{
  display:flex;align-items:center;gap:18px;
  padding:12px 20px;border-bottom:1px solid var(--ink-3);
  flex-wrap:wrap;
}
.brand{font-family:var(--jp-serif);font-size:26px;letter-spacing:.06em;color:var(--washi)}
.brand span{font-family:var(--ui);font-size:11px;letter-spacing:.14em;color:var(--mute);margin-left:8px;vertical-align:2px}
header .grow{flex:1}
.hstat{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute)}
.hstat b{color:var(--washi);font-weight:600}
.hstat.due b{color:var(--brass)}

/* progress hairline — the one accent moment */
#meter{height:2px;background:var(--ink-3);position:relative;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--brass);transition:width .45s cubic-bezier(.2,.7,.2,1)}

main{flex:1;display:flex;min-height:0}
nav{
  width:196px;flex:0 0 196px;border-right:1px solid var(--ink-3);
  padding:14px 0;display:flex;flex-direction:column;gap:1px;overflow-y:auto
}
nav h4{margin:16px 16px 6px;font-size:10.5px;letter-spacing:.16em;color:var(--mute);font-weight:600}
nav h4:first-child{margin-top:2px}
nav button{
  text-align:left;padding:8px 16px;color:var(--washi);opacity:.72;
  border-left:2px solid transparent;display:flex;align-items:baseline;gap:8px
}
nav button:hover{opacity:1;background:var(--ink-2)}
nav button.on{opacity:1;background:var(--ink-2);border-left-color:var(--brass)}
nav button .jp{font-family:var(--jp-serif);font-size:16px;width:18px;color:var(--brass)}
nav button small{color:var(--mute);font-size:11px;margin-left:auto;font-variant-numeric:tabular-nums}

#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;min-width:0}

/* ---------- card ---------- */
.card{
  background:var(--washi);color:var(--sumi);border-radius:var(--r);
  width:100%;max-width:660px;padding:34px 30px;text-align:center;
  box-shadow:0 1px 0 var(--washi-2) inset;
}
.tag{font-size:11px;letter-spacing:.13em;color:#6B6257;margin-bottom:22px}
.prompt-jp{font-family:var(--jp-serif);line-height:1.12;letter-spacing:.02em;word-break:break-all}
.sz-xl{font-size:clamp(84px,17vw,148px)}
.sz-lg{font-size:clamp(48px,9vw,78px)}
.sz-md{font-size:clamp(30px,5.4vw,44px)}
.prompt-en{font-size:clamp(20px,3.4vw,29px);font-weight:500;line-height:1.3}
.sub{margin-top:14px;font-size:14px;color:#6B6257;font-family:var(--jp-sans)}

.opts{display:grid;gap:9px;width:100%;max-width:660px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r);
  padding:13px 15px;transition:background .12s,border-color .12s
}
.opt:hover:not(:disabled){background:#22304F;border-color:#3B4C70}
.opt kbd{
  font-family:var(--ui);font-size:11px;color:var(--mute);border:1px solid var(--ink-3);
  border-radius:2px;padding:1px 6px;flex:0 0 auto;font-variant-numeric:tabular-nums
}
.opt .txt{font-family:var(--jp-sans);font-size:19px}
.opt .txt.en{font-family:var(--ui);font-size:16px}
.opt.right{background:var(--moss);border-color:var(--moss);color:#fff}
.opt.right kbd{color:#E7F0E8;border-color:#5A8C69}
.opt.wrong{background:var(--shu);border-color:var(--shu);color:#fff}
.opt.wrong kbd{color:#F6DED8;border-color:#D2705E}
.opt.dim{opacity:.4}

/* typing mode */
.typebox{display:flex;gap:9px;width:100%;max-width:660px;margin-top:16px}
.typebox input{
  flex:1;background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r);
  color:var(--washi);padding:13px 15px;font-family:var(--jp-sans);font-size:20px;text-align:center
}
.typebox input:focus{outline:2px solid var(--brass);outline-offset:-1px}
.typebox button{background:var(--brass);color:#1A1503;padding:0 22px;border-radius:var(--r);font-weight:600}

/* feedback strip */
.fb{width:100%;max-width:660px;margin-top:14px;border-radius:var(--r);padding:13px 16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--moss-lt);color:#1F3A28}
.fb.no{background:var(--shu-lt);color:#5C1B11}
.fb .hd{font-weight:700;margin-bottom:3px}
.fb .jp{font-family:var(--jp-sans)}
.fb .nx{float:right;font-size:12px;opacity:.75}

/* match game */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:680px}
.tile{
  background:var(--washi);color:var(--sumi);border-radius:var(--r);
  min-height:74px;display:flex;align-items:center;justify-content:center;
  padding:8px;text-align:center;font-family:var(--jp-sans);font-size:15px;
  transition:transform .1s,opacity .2s
}
.tile.jp{font-family:var(--jp-serif);font-size:27px}
.tile.sel{outline:2px solid var(--brass);outline-offset:-2px}
.tile.gone{opacity:0;pointer-events:none}
.tile.miss{background:var(--shu-lt)}

/* stats */
.panel{width:100%;max-width:820px}
.panel h2{font-family:var(--jp-serif);font-size:30px;margin:0 0 4px;font-weight:400}
.panel p.lede{color:var(--mute);margin:0 0 26px;max-width:62ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:26px}
.kpi{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:27px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--mute)}
.kpi.due b{color:var(--brass)}
.kpi.leech b{color:var(--shu)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:flex;align-items:center;gap:10px;font-size:13px}
.bar .lbl{width:104px;color:var(--mute);flex:0 0 auto}
.bar .track{flex:1;height:16px;background:var(--ink-2);border-radius:2px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--ink-3)}
.bar .track i.m{background:var(--moss)}
.bar .n{width:58px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);flex:0 0 auto}

table.leech{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.leech th{text-align:left;color:var(--mute);font-weight:600;font-size:11px;letter-spacing:.1em;padding:6px 8px;border-bottom:1px solid var(--ink-3)}
table.leech td{padding:7px 8px;border-bottom:1px solid var(--ink-2)}
table.leech td.jp{font-family:var(--jp-serif);font-size:20px}
table.leech td.r{font-family:var(--jp-sans)}
table.leech td.x{text-align:right;color:var(--shu);font-variant-numeric:tabular-nums}

/* settings */
.row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row>label{width:150px;color:var(--mute);font-size:13px;flex:0 0 auto}
.seg{display:flex;border:1px solid var(--ink-3);border-radius:var(--r);overflow:hidden}
.seg button{padding:7px 14px;color:var(--mute);font-size:13px}
.seg button.on{background:var(--ink-2);color:var(--washi)}
.btn{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r);padding:9px 16px}
.btn:hover{background:#22304F}
.btn.warn{border-color:#5A2A22;color:#E9A899}
.btn.warn:hover{background:#3A1C16}
.btn.go{background:var(--brass);color:#1A1503;border-color:var(--brass);font-weight:600}
.btn.go:hover{background:#CBA43A}

/* exam */
.exam-q{width:100%;max-width:700px}
.exam-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;font-size:13px;color:var(--mute)}
.exam-hd .t{margin-left:auto;font-variant-numeric:tabular-nums;font-size:16px;color:var(--washi)}
.exam-hd .t.low{color:var(--shu)}
.sentence{
  background:var(--washi);color:var(--sumi);border-radius:var(--r);padding:26px 24px;
  font-family:var(--jp-sans);font-size:clamp(18px,3vw,23px);line-height:1.85;text-align:left
}
.sentence u{text-decoration:none;border-bottom:2.5px solid var(--shu);font-weight:600;padding-bottom:1px}

.empty{text-align:center;color:var(--mute);max-width:44ch}
.empty .jp{font-family:var(--jp-serif);font-size:58px;color:var(--ink-3);display:block;margin-bottom:10px}

footer{padding:9px 20px;border-top:1px solid var(--ink-3);font-size:11.5px;color:var(--mute);display:flex;gap:16px;flex-wrap:wrap}
kbd.f{border:1px solid var(--ink-3);border-radius:2px;padding:0 4px;font-family:var(--ui)}

@media(max-width:760px){
  main{flex-direction:column}
  nav{width:auto;flex:0 0 auto;border-right:none;border-bottom:1px solid var(--ink-3);
      flex-direction:row;overflow-x:auto;padding:6px;gap:4px}
  nav h4{display:none}
  nav button{border-left:none;border-bottom:2px solid transparent;padding:7px 12px;white-space:nowrap}
  nav button.on{border-left-color:transparent;border-bottom-color:var(--brass)}
  nav button small{display:none}
  #stage{padding:16px 14px}
  .card{padding:24px 18px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .opts.two{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">藍<span>N4 TRAINER</span></div>
    <div class="grow"></div>
    <div class="hstat due">due <b id="h-due">0</b></div>
    <div class="hstat">seen <b id="h-seen">0</b></div>
    <div class="hstat">mastered <b id="h-mast">0</b></div>
    <div class="hstat">session <b id="h-sess">0/0</b></div>
  </header>
  <div id="meter"><i></i></div>
  <main>
    <nav id="nav"></nav>
    <div id="stage"></div>
  </main>
  <footer>
    <span><kbd class="f">1</kbd>–<kbd class="f">4</kbd> answer</span>
    <span><kbd class="f">Enter</kbd> next</span>
    <span><kbd class="f">Space</kbd> reveal</span>
    <span><kbd class="f">Esc</kbd> menu</span>
    <span style="margin-left:auto">progress saves in this browser</span>
  </footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
